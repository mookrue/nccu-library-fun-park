<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>政大圖書館遊樂園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#FBE2E9;
    --sky-deep:#F6C3D0;
    --sun:#FFD650;
    --sun-deep:#FFC22E;
    --cream:#FFF9EC;
    --coral:#F27992;
    --coral-deep:#E05C7A;
    --mint:#BDE8C9;
    --ink:#4A4453;
    --ink-soft:#7A7385;
    --line:#8A6F5C;
    --radius:22px;
    --shadow:0 4px 0 rgba(122,111,92,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Nunito','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    background:var(--sky);
    color:var(--ink);
    min-height:100vh;
    line-height:1.65;
  }
  h1,h2,h3,.font-display{font-family:'Baloo 2','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  .app{max-width:560px;margin:0 auto;padding:0 16px 48px;position:relative;}

  /* ---------- decorative sky ---------- */
  .sky-deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .cloud{position:absolute;opacity:.85;}
  @media (prefers-reduced-motion: no-preference){
    .cloud{animation:drift 46s linear infinite;}
    .cloud.c2{animation-duration:64s;animation-delay:-20s;}
    .cloud.c3{animation-duration:80s;animation-delay:-45s;}
    @keyframes drift{from{transform:translateX(-160px);}to{transform:translateX(110vw);}}
  }
  .screen{position:relative;z-index:1;}

  /* ---------- language toggle ---------- */
  .lang-toggle{
    position:absolute;top:14px;right:0;z-index:10;
    background:var(--cream);border:2.5px solid var(--line);border-radius:999px;
    font-family:'Baloo 2',sans-serif;font-weight:800;font-size:.85rem;
    padding:6px 14px;box-shadow:var(--shadow);text-decoration:none;
  }

  /* ---------- header ---------- */
  header.park-header{padding:26px 4px 8px;text-align:center;}
  .park-arch{width:min(100%,420px);margin:0 auto;display:block;}
  .park-sub{color:var(--ink-soft);font-size:.95rem;margin-top:2px;}
  .park-sub b{color:var(--ink);}

  /* ---------- sticker bar ---------- */
  .sticker-bar{
    position:sticky;top:10px;z-index:20;
    background:var(--cream);
    border:3px solid var(--line);
    border-radius:999px;
    box-shadow:var(--shadow);
    display:flex;align-items:center;gap:8px;
    padding:8px 14px;margin:14px auto 6px;
    width:fit-content;max-width:100%;
  }
  .sticker-bar .label{font-weight:900;font-size:.82rem;letter-spacing:.08em;color:var(--ink-soft);}
  .sticker-slot{
    width:34px;height:34px;border-radius:50%;
    border:2.5px dashed #C9BBA8;background:#FFFDF6;
    display:flex;align-items:center;justify-content:center;
    font-size:1.05rem;transition:transform .25s;
  }
  .sticker-slot.earned{border:2.5px solid var(--coral);background:#FDE8EE;}
  @media (prefers-reduced-motion: no-preference){
    .sticker-slot.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
    @keyframes pop{0%{transform:scale(.2) rotate(-25deg);}100%{transform:scale(1) rotate(0);}}
  }

  /* ---------- attraction cards (map) ---------- */
  .map-list{display:flex;flex-direction:column;gap:18px;margin-top:16px;}
  .attraction{
    background:var(--cream);
    border:3px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;text-align:left;width:100%;
    transition:transform .15s;
    position:relative;
  }
  .attraction:active{transform:scale(.985);}
  .attraction .art{background:linear-gradient(180deg,#FDF0F4 0%,#FFF6D9 100%);display:block;width:100%;}
  .attraction .art svg{display:block;width:100%;height:auto;}
  .attraction .meta{padding:14px 18px 16px;display:flex;align-items:center;gap:12px;}
  .attraction .meta .txt{flex:1;}
  .attraction h2{font-size:1.25rem;line-height:1.3;font-weight:900;}
  .attraction .tag{color:var(--ink-soft);font-size:.9rem;}
  .attraction .go{
    background:var(--sun);border:2.5px solid var(--line);border-radius:999px;
    font-weight:900;font-size:.85rem;padding:8px 14px;white-space:nowrap;
    box-shadow:0 3px 0 rgba(122,111,92,.25);
  }
  .attraction .stamp-mark{
    position:absolute;top:10px;right:12px;
    background:var(--coral);color:#fff;border:2.5px solid #fff;
    border-radius:999px;font-size:.75rem;font-weight:900;
    padding:4px 10px;transform:rotate(6deg);
    box-shadow:0 2px 0 rgba(122,111,92,.3);
    display:none;
  }
  .attraction.done .stamp-mark{display:block;}

  /* ---------- prize / footer card ---------- */
  .prize-card{
    margin-top:26px;background:var(--cream);
    border:3px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px 20px;text-align:center;
  }
  .prize-card h2{font-size:1.3rem;margin-bottom:6px;font-weight:900;}
  .prize-card p{color:var(--ink-soft);font-size:.95rem;}
  .btn-big{
    display:inline-block;margin-top:14px;
    background:var(--coral);color:#fff;
    border:3px solid var(--line);border-radius:999px;
    font-weight:900;font-size:1.05rem;
    padding:12px 26px;box-shadow:0 4px 0 rgba(122,111,92,.3);
    transition:transform .15s,opacity .2s;text-decoration:none;
  }
  .btn-big:active{transform:translateY(2px);}
  .btn-big[disabled]{opacity:.45;cursor:not-allowed;}
  .btn-big.alt{background:var(--sun);color:var(--ink);}
  .feedback-note{margin-top:16px;font-size:.9rem;color:var(--ink-soft);}
  .feedback-note a{font-weight:900;color:var(--coral-deep);}

  /* ---------- zone screen ---------- */
  .zone-screen{display:none;}
  .zone-screen.active{display:block;}
  .map-screen.hidden{display:none;}
  .zone-top{display:flex;align-items:center;gap:10px;padding:18px 0 8px;}
  .btn-back{
    background:var(--cream);border:3px solid var(--line);border-radius:999px;
    box-shadow:var(--shadow);font-weight:900;font-size:.9rem;
    padding:8px 16px;
  }
  .zone-hero{
    background:var(--cream);border:3px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;margin-top:8px;
  }
  .zone-hero .art{background:linear-gradient(180deg,#FDF0F4 0%,#FFF6D9 100%);}
  .zone-hero .art svg{display:block;width:100%;height:auto;}
  .zone-hero .intro{padding:16px 18px 18px;}
  .zone-hero h2{font-size:1.35rem;font-weight:900;}
  .zone-hero .intro p{margin-top:6px;font-size:.95rem;}

  /* ---------- spot chips ---------- */
  .spots{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
  .spot{
    background:var(--cream);border:3px solid var(--line);
    border-radius:18px;box-shadow:var(--shadow);overflow:hidden;
  }
  .spot-head{
    width:100%;display:flex;align-items:center;gap:12px;
    padding:12px 14px;text-align:left;
  }
  .spot-head .emoji{
    width:42px;height:42px;flex:0 0 42px;border-radius:50%;
    background:var(--sky-deep);border:2.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:1.25rem;
  }
  .spot-head .who{flex:1;}
  .spot-head .who b{font-size:1.02rem;display:block;line-height:1.35;font-weight:900;}
  .spot-head .who span{font-size:.82rem;color:var(--ink-soft);}
  .spot-head .chev{font-size:1.1rem;color:var(--ink-soft);transition:transform .25s;}
  .spot.open .chev{transform:rotate(90deg);}
  .spot-body{display:none;padding:0 16px 14px;font-size:.94rem;}
  .spot.open .spot-body{display:block;}
  .spot-body p+p{margin-top:8px;}
  .spot-body .hint{background:#FFF3C4;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.9rem;}
  .link-out{
    display:inline-block;margin-top:10px;margin-right:8px;
    background:var(--sun);border:2.5px solid var(--line);border-radius:999px;
    font-weight:900;font-size:.85rem;padding:7px 14px;text-decoration:none;
    box-shadow:0 3px 0 rgba(122,111,92,.25);
  }
  .link-out.blue{background:var(--sky-deep);}

  /* ---------- carousel horses grid ---------- */
  .horse-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .horse{
    background:#FFFDF6;border:2.5px solid var(--line);border-radius:16px;
    padding:10px 12px;text-align:left;box-shadow:0 3px 0 rgba(122,111,92,.15);
  }
  .horse .h-name{font-weight:900;font-size:.92rem;display:flex;gap:6px;align-items:center;}
  .horse .h-desc{font-size:.8rem;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
  .horse a{font-size:.8rem;font-weight:900;color:var(--coral-deep);}

  /* ---------- quiz ---------- */
  .quiz{
    margin-top:18px;background:var(--sun);
    border:3px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;
  }
  .quiz .q-label{
    display:inline-block;background:var(--ink);color:var(--sun);
    font-weight:900;font-size:.78rem;
    border-radius:999px;padding:4px 12px;letter-spacing:.1em;
  }
  .quiz h3{margin-top:10px;font-size:1.08rem;line-height:1.5;font-weight:900;}
  .quiz .opts{display:flex;flex-direction:column;gap:9px;margin-top:12px;}
  .quiz .opt{
    background:var(--cream);border:2.5px solid var(--line);border-radius:14px;
    padding:11px 14px;text-align:left;font-weight:700;font-size:.93rem;
    box-shadow:0 3px 0 rgba(122,111,92,.2);transition:transform .12s;
  }
  .quiz .opt:active{transform:translateY(2px);}
  .quiz .opt.correct{background:var(--mint);border-color:#4E8B60;}
  .quiz .opt.wrong{background:#FFE3DC;border-color:var(--coral-deep);}
  @media (prefers-reduced-motion: no-preference){
    .quiz .opt.wrong{animation:shake .4s;}
    @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  }
  .quiz .result{margin-top:12px;font-weight:900;display:none;}
  .quiz .result.show{display:block;}
  .quiz.solved .opts .opt{pointer-events:none;opacity:.75;}
  .quiz.solved .opts .opt.correct{opacity:1;}

  .zone-nav{display:flex;justify-content:center;margin:22px 0 10px;}

  /* ---------- celebration overlay ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(74,68,83,.45);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.show{display:flex;}
  .overlay .card{
    background:var(--cream);border:3px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);max-width:380px;width:100%;
    padding:26px 22px;text-align:center;
  }
  .overlay .big-emoji{font-size:3rem;}
  .overlay h2{font-size:1.4rem;margin-top:6px;font-weight:900;}
  .overlay p{color:var(--ink-soft);font-size:.95rem;margin-top:6px;}
  canvas#ticketCanvas{display:none;}

  .credit{margin-top:26px;text-align:center;font-size:.8rem;color:var(--ink-soft);}
</style>
</head>
<body>

<div class="sky-deco" aria-hidden="true">
  <svg class="cloud c1" style="top:8%;left:-160px" width="120" height="52" viewBox="0 0 120 52"><g fill="#fff"><ellipse cx="38" cy="34" rx="34" ry="17"/><ellipse cx="72" cy="26" rx="28" ry="18"/><ellipse cx="96" cy="36" rx="22" ry="13"/></g></svg>
  <svg class="cloud c2" style="top:34%;left:-160px" width="96" height="44" viewBox="0 0 120 52"><g fill="#fff"><ellipse cx="38" cy="34" rx="34" ry="17"/><ellipse cx="72" cy="26" rx="28" ry="18"/><ellipse cx="96" cy="36" rx="22" ry="13"/></g></svg>
  <svg class="cloud c3" style="top:66%;left:-160px" width="140" height="60" viewBox="0 0 120 52"><g fill="#fff" opacity=".8"><ellipse cx="38" cy="34" rx="34" ry="17"/><ellipse cx="72" cy="26" rx="28" ry="18"/><ellipse cx="96" cy="36" rx="22" ry="13"/></g></svg>
</div>

<div class="app">

    </header>

    <div class="sticker-bar" id="stickerBar" aria-label="集章進度">
      <span class="label">集章</span>
      <span class="sticker-slot" data-slot="gate">🎟️</span>

  </div>

  <!-- ==================== ZONE SCREEN ==================== -->
  <div class="screen zone-screen" id="zoneScreen">
    <div class="zone-top">

</div>

<!-- ==================== CELEBRATION OVERLAY ==================== -->
<div class="overlay" id="overlay">
  <div class="card">
    <div class="big-emoji" id="ovEmoji">🎉</div>

<!-- ==================== TICKET OVERLAY ==================== -->
<div class="overlay" id="ticketOverlay">

    <h2>🎫 你的紀念門票!</h2>
    <img id="ticketImg" alt="政大圖書館遊樂園紀念門票" style="width:100%;border-radius:14px;border:3px solid var(--line);margin-top:12px;">

</div>

<canvas id="ticketCanvas" width="1200" height="680"></canvas>

<script>

    <circle cx="268" cy="160" r="15" fill="#4A4453" stroke="#8A6F5C" stroke-width="5"/>
    <circle cx="268" cy="160" r="5" fill="#FFF9EC"/>
    <path d="M330 140 q4 -18 18 -18 M52 148 q-2 -14 12 -18" stroke="#7BB88C" stroke-width="5" fill="none" stroke-linecap="round"/>
  </svg>`,
};

/* =====================================================================
   ⚙️  遊戲邏輯 — 以下不需要修改
   ===================================================================== */
const state = { earned:{} };
const $ = s => document.querySelector(s);

/* ---- 進度保存(安全防護:環境不支援時自動退回一次性遊玩)---- */
const STORAGE_KEY = "nccu-funpark-progress-zh";
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.earned)); }catch(e){}
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state.earned = JSON.parse(raw) || {};
  }catch(e){ state.earned = {}; }
}
function resetProgress(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  location.reload();
}
loadProgress();

document.getElementById("feedbackLink").href = FEEDBACK_FORM_URL;

/* ---- 建立地圖卡片 ---- */
const mapList = $("#mapList");
ZONES.forEach((z,i)=>{
  const card = document.createElement("button");
  card.className = "attraction";
  card.id = "card-"+z.id;
  card.setAttribute("aria-label", z.name);
  card.innerHTML = `
    <span class="stamp-mark">✓ 貼紙到手!</span>
    <span class="art">${ART[z.art]}</span>
    <span class="meta">
      <span class="txt"><h2>${z.emoji} ${z.name}</h2><span class="tag">${z.tag}</span></span>
      <span class="go">入場 →</span>
    </span>`;
  card.addEventListener("click",()=>openZone(i));
  mapList.appendChild(card);
});

/* ---- 還原已保存的進度 ---- */
(function restoreUI(){
  let count = 0;
  ZONES.forEach(z=>{
    if(state.earned[z.id]){
      count++;
      const slot = document.querySelector(`.sticker-slot[data-slot="${z.id}"]`);
      if(slot) slot.classList.add("earned");
      const card = document.getElementById("card-"+z.id);
      if(card) card.classList.add("done");
    }
  });
  if(count===ZONES.length) $("#downloadBtn").disabled = false;
})();

/* ---- 關卡畫面 ---- */
function openZone(i){
  const z = ZONES[i];
  const solved = !!state.earned[z.id];
  const spotsHTML = z.spots.map((s,si)=>`
    <div class="spot" data-spot="${si}">
      <button class="spot-head" aria-expanded="false">
        <span class="emoji">${s.emoji}</span>
        <span class="who"><b>${s.who}</b><span>${s.role}</span></span>
        <span class="chev">›</span>
      </button>
      <div class="spot-body">
        ${s.body}
        ${(s.links||[]).map(l=>`<a class="link-out ${l.blue?'blue':''}" href="${l.url}" target="_blank" rel="noopener">${l.label} ↗</a>`).join("")}
      </div>
    </div>`).join("");

  const optsHTML = z.quiz.opts.map((o,oi)=>
    `<button class="opt" data-oi="${oi}">${o}</button>`).join("");

  $("#zoneContent").innerHTML = `
    <div class="zone-hero">
      <div class="art">${ART[z.art]}</div>
      <div class="intro">
        <h2>${z.emoji} ${z.name}</h2>
        <p>${z.intro}</p>
      </div>
    </div>
    <div class="spots">${spotsHTML}</div>
    <div class="quiz ${solved?'solved':''}" id="quizBox">
      <span class="q-label">⭐ 集章挑戰</span>
      <h3>${z.quiz.q}</h3>
      <div class="opts">${optsHTML}</div>
      <p class="result ${solved?'show':''}" id="quizResult">${solved?'✅ 這關的貼紙已經到手,讚!':''}</p>
    </div>`;

  /* 手風琴展開 */
  document.querySelectorAll(".spot-head").forEach(h=>{
    h.addEventListener("click",()=>{
      const sp = h.parentElement;
      sp.classList.toggle("open");
      h.setAttribute("aria-expanded", sp.classList.contains("open"));
    });
  });

  /* 集章挑戰 */
  document.querySelectorAll("#quizBox .opt").forEach(btn=>{
    if(solved && +btn.dataset.oi===z.quiz.correct) btn.classList.add("correct");
    btn.addEventListener("click",()=>{
      const oi = +btn.dataset.oi;
      const res = $("#quizResult");
      if(oi===z.quiz.correct){
        btn.classList.add("correct");
        $("#quizBox").classList.add("solved");
        res.textContent = "✅ " + z.quiz.praise;
        res.classList.add("show");
        earnSticker(z);
      }else{
        btn.classList.remove("wrong"); void btn.offsetWidth;
        btn.classList.add("wrong");
        res.textContent = "🙈 差一點——答案就藏在這個設施裡,再找找看!";
        res.classList.add("show");
      }
    });
  });

  $("#mapScreen").classList.add("hidden");
  $("#zoneScreen").classList.add("active");
  window.scrollTo({top:0,behavior:"instant"});
}

function backToMap(){
  $("#zoneScreen").classList.remove("active");
  $("#mapScreen").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"instant"});
}
$("#backBtn").addEventListener("click",backToMap);
$("#backBtn2").addEventListener("click",backToMap);
$("#resetBtn").addEventListener("click",()=>{
  if(confirm("要清除所有貼紙、重新開始探險嗎?")) resetProgress();
});

/* ---- 集章 ---- */
function earnSticker(z){
  if(state.earned[z.id]) return;
  state.earned[z.id] = true;
  saveProgress();
  const slot = document.querySelector(`.sticker-slot[data-slot="${z.id}"]`);
  slot.classList.add("earned","pop");
  document.getElementById("card-"+z.id).classList.add("done");
  const count = Object.keys(state.earned).length;
  if(count===ZONES.length){
    $("#downloadBtn").disabled = false;
    showOverlay("🏆","全部集滿!","你已經探索完整座遊樂園!回到地圖下載你的紀念門票——也別忘了留下回饋喔!");
  }else{
    showOverlay("🎉","獲得貼紙!",`${z.emoji} ${z.name}貼紙入手——已收集 ${count}/5 張,繼續探險吧!`);
  }
}

/* ---- 慶祝視窗 ---- */
function showOverlay(emoji,title,text){
  $("#ovEmoji").textContent = emoji;
  $("#ovTitle").textContent = title;
  $("#ovText").textContent = text;
  $("#overlay").classList.add("show");
}
$("#ovBtn").addEventListener("click",()=>$("#overlay").classList.remove("show"));

/* ---- 紀念門票(canvas 產生 PNG)---- */
$("#downloadBtn").addEventListener("click",()=>{
  const c = document.getElementById("ticketCanvas");
  const ctx = c.getContext("2d");
  const W=c.width, H=c.height;
  const TC = "'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";

  // 背景
  ctx.fillStyle="#FBE2E9"; ctx.fillRect(0,0,W,H);
  // 票券本體
  roundRect(ctx,60,60,W-120,H-120,48);
  ctx.fillStyle="#FFF9EC"; ctx.fill();
  ctx.lineWidth=10; ctx.strokeStyle="#8A6F5C"; ctx.stroke();
  // 撕票虛線
  ctx.setLineDash([2,22]); ctx.lineWidth=6; ctx.strokeStyle="#C9BBA8";
  ctx.beginPath(); ctx.moveTo(W-320,80); ctx.lineTo(W-320,H-80); ctx.stroke();
  ctx.setLineDash([]);
  // 標題帶
  roundRect(ctx,100,100,W-460,110,28);
  ctx.fillStyle="#FFD650"; ctx.fill();
  ctx.lineWidth=8; ctx.strokeStyle="#8A6F5C"; ctx.stroke();
  ctx.fillStyle="#4A4453";
  ctx.font="900 54px "+TC;
  ctx.textAlign="left";
  ctx.fillText("政大圖書館 夢幻遊樂園",130,175);
  // 副標
  ctx.font="900 36px "+TC;
  ctx.fillStyle="#E05C7A";
  ctx.fillText("★ 遊樂園探險完成證明 ★",110,282);
  ctx.font="500 28px "+TC;
  ctx.fillStyle="#4A4453";
  ctx.fillText("這位探險家走遍了全部 5 個遊樂設施,",110,342);
  ctx.fillText("並收集到園區裡的每一張貼紙!",110,384);
  // 日期
  const d = new Date();
  ctx.font="700 26px "+TC;
  ctx.fillStyle="#7A7385";
  ctx.fillText("入園日期:"+d.getFullYear()+" 年 "+(d.getMonth()+1)+" 月 "+d.getDate()+" 日",110,452);
  // 貼紙印章
  const emojis = ["🎟️","🎠","🎢","🎡","🚌"];
  emojis.forEach((e,i)=>{
    const x=140+i*140, y=530;
    ctx.beginPath(); ctx.arc(x,y,52,0,Math.PI*2);
    ctx.fillStyle="#FDE8EE"; ctx.fill();
    ctx.lineWidth=7; ctx.strokeStyle="#F27992"; ctx.stroke();
    ctx.font="52px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(e,x,y+4);
    ctx.textBaseline="alphabetic";
  });
  ctx.textAlign="left";
  // 票根側邊
  ctx.save();
  ctx.translate(W-190,H/2); ctx.rotate(-Math.PI/2);
  ctx.font="900 42px "+TC;
  ctx.fillStyle="#8A6F5C"; ctx.textAlign="center";
  ctx.fillText("入場券 ★ 政大圖書館",0,0);
  ctx.restore();
  // 票根大戳章
  ctx.save();
  ctx.translate(W-190,H-190); ctx.rotate(0.15);
  ctx.beginPath(); ctx.arc(0,0,70,0,Math.PI*2);
  ctx.lineWidth=8; ctx.strokeStyle="#E05C7A"; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,56,0,Math.PI*2);
  ctx.lineWidth=3; ctx.strokeStyle="#E05C7A"; ctx.stroke();
  ctx.fillStyle="#E05C7A"; ctx.textAlign="center";
  ctx.font="900 30px "+TC;
  ctx.fillText("通關!",0,-4);
  ctx.font="700 18px "+TC;
  ctx.fillText("政大圖書館",0,26);
  ctx.restore();

  const dataURL = c.toDataURL("image/png");
  document.getElementById("ticketImg").src = dataURL;
  document.getElementById("ticketSave").href = dataURL;
  document.getElementById("ticketOverlay").classList.add("show");
});
document.getElementById("ticketClose").addEventListener("click",()=>{
  document.getElementById("ticketOverlay").classList.remove("show");
});

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
</script>
</body>
